[package]
name = "opui"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "openpencil-runtime-ui checker and canonicalizer"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.48", default-features = false }
roxmltree = "0.21"
ryu-js = "1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
